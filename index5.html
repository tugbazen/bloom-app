<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="bloom-version" content="2.7.1">
<meta name="theme-color" content="#FCEAF1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bloom – Tuğba'nın Dünyası 🌷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<!-- Yazı tipleri yalnızca görünüm içindir; çevrimdışıyken sistem yazı tiplerine geçilir. Hiçbir kullanıcı verisi dışarı gönderilmez. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8FA; --pink1:#FCEAF1; --pink2:#F5DCE8; --pink3:#E8BFD1; --rose:#D68BAA; --dusty:#C78BA0;
  --sage:#E7EEE5; --sage2:#B9CDB3; --sage3:#8DB585; --lav:#F3EDF8; --lav2:#D9CCEB; --cream:#FFF6EC; --ivory:#FFFDF8;
  --text:#5B4450; --muted:#A08896; --line:rgba(232,191,209,.5); --water:#A9D6EC;
  --shadow:0 6px 24px rgba(214,139,170,.12); --shadow-h:0 12px 32px rgba(214,139,170,.2);
  --r:22px; --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Quicksand','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 400px at 90% -5%,rgba(243,237,248,.9),transparent 70%),
             radial-gradient(500px 380px at -5% 30%,rgba(252,234,241,.9),transparent 70%),
             radial-gradient(500px 400px at 70% 110%,rgba(231,238,229,.8),transparent 70%)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:#6a4659;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mb{margin-bottom:14px}
.hidden{display:none!important}

/* ---------- LAYOUT ---------- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;padding:26px 16px 18px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink2),var(--lav));display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.brand b{font-family:var(--serif);font-size:24px;color:var(--rose);display:block;line-height:1}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;font-weight:600;color:#7a6070;transition:background .2s,color .2s,transform .2s;user-select:none}
.nav-item .ni{font-size:18px;width:24px;text-align:center}
.nav-item:hover{background:var(--pink1);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,var(--pink2),var(--lav));color:#8a4766;box-shadow:0 4px 14px rgba(214,139,170,.18)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.side-level{margin-top:auto;padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--cream),var(--pink1));border:1px solid var(--line)}
.main{margin-left:248px;padding:28px 34px 48px;max-width:1320px}
.topbar{display:none;position:sticky;top:0;z-index:25;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,248,250,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .brand{padding:0}.topbar .brand .logo{width:34px;height:34px;font-size:18px;border-radius:11px}.topbar .brand b{font-size:20px}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 2px;border-radius:12px;flex:1;cursor:pointer;transition:color .2s,background .2s;min-width:0}
.bn .ni{font-size:20px;transition:transform .25s}
.bn.active{color:var(--rose);background:var(--pink1)} .bn.active .ni{transform:translateY(-2px) scale(1.1)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:30px}
.page-head p{color:var(--muted)}
.view-anim{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- GRID & CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:rgba(255,255,255,.92);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{box-shadow:var(--shadow-h)}
.card.lift:hover{transform:translateY(-3px)}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card-link{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--rose);cursor:pointer;white-space:nowrap}
.card-link:hover{text-decoration:underline}
.card.tint-pink{background:linear-gradient(160deg,#fff,var(--pink1))}
.card.tint-lav{background:linear-gradient(160deg,#fff,var(--lav))}
.card.tint-sage{background:linear-gradient(160deg,#fff,var(--sage))}
.card.tint-cream{background:linear-gradient(160deg,#fff,var(--cream))}
.deco{position:absolute;pointer-events:none;opacity:.55;font-size:22px;animation:float 6s ease-in-out infinite}

/* ---------- BUTTONS / INPUTS ---------- */
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#EBADC6,#D68BAA);color:#fff;box-shadow:0 4px 14px rgba(214,139,170,.35);transition:transform .15s,box-shadow .2s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(214,139,170,.45)}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--pink1);color:#a35677;box-shadow:none}.btn.soft:hover{background:var(--pink2)}
.btn.lav{background:var(--lav);color:#7d62a3;box-shadow:none}.btn.lav:hover{background:var(--lav2)}
.btn.sage{background:var(--sage);color:#5f8456;box-shadow:none}.btn.sage:hover{background:#dbe6d8}
.btn.water{background:linear-gradient(135deg,#cfe9f5,#a9d6ec);color:#3f7c9a;box-shadow:0 4px 12px rgba(120,180,210,.25)}
.btn.ghost{background:transparent;color:var(--rose);border:1.5px solid var(--pink3);box-shadow:none}
.btn.danger{background:#fbe3e6;color:#c0566b;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.big{padding:14px 30px;font-size:17px}
.btn.icon{width:34px;height:34px;padding:0;border-radius:12px}
.btn.icon.sm{width:28px;height:28px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);padding:10px 13px;border-radius:14px;border:1.5px solid var(--pink2);background:var(--ivory);outline:none;transition:border .2s,box-shadow .2s;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(214,139,170,.15)}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto;accent-color:var(--rose)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1}

/* ---------- TABS / CHIPS ---------- */
.tabs{display:inline-flex;gap:4px;background:var(--pink1);padding:5px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:#b08197;white-space:nowrap;transition:all .2s;user-select:none}
.tab:hover{color:var(--rose)}
.tab.active{background:#fff;color:var(--rose);box-shadow:0 3px 10px rgba(214,139,170,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--pink2);font-weight:600;font-size:13.5px;cursor:pointer;transition:all .2s;user-select:none}
.chip:hover{border-color:var(--pink3);background:var(--bg)}
.chip.on{background:linear-gradient(135deg,var(--pink2),var(--lav));border-color:transparent;color:#8a4766;box-shadow:0 3px 10px rgba(214,139,170,.2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pink1);color:#a35677}
.tag.lav{background:var(--lav);color:#7d62a3}.tag.sage{background:var(--sage);color:#5f8456}.tag.cream{background:var(--cream);color:#a07a4f}.tag.blue{background:#e6f3fa;color:#4f8bab}.tag.red{background:#fde4e8;color:#c0566b}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;min-width:64px}
.mood .me{font-size:26px;transition:transform .25s}
.mood span{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.mood:hover .me{transform:scale(1.18) rotate(-6deg)}
.mood.on{border-color:var(--pink3);background:#fff;box-shadow:0 4px 14px rgba(214,139,170,.22)}
.mood.on span{color:var(--rose)}

/* ---------- CHECK ITEMS ---------- */
.check-list{display:flex;flex-direction:column;gap:2px}
.check-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:background .2s;user-select:none;position:relative}
.check-item:hover{background:var(--bg)}
.cbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--pink3);display:grid;place-items:center;flex-shrink:0;transition:all .25s cubic-bezier(.2,.8,.2,1);background:#fff}
.cbox svg{width:14px;height:14px;opacity:0;transform:scale(.3) rotate(-20deg);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check-item.done .cbox{background:linear-gradient(135deg,#EBADC6,#D68BAA);border-color:transparent;box-shadow:0 3px 8px rgba(214,139,170,.4)}
.check-item.done .cbox svg{opacity:1;transform:scale(1)}
.check-item .ct{flex:1;font-weight:600;transition:color .25s}
.check-item.done .ct{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pink3)}
.check-item .time{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:99px}
.check-item .x{opacity:0;transition:opacity .2s}
.check-item:hover .x{opacity:1}
@media(hover:none){.check-item .x{opacity:.6}}
.pop{animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
.step-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink1),var(--lav));color:#8a4766;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--pink3)}
.skin-step{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);transition:background .2s,border-color .2s;user-select:none}
.skin-step:hover{background:var(--bg);border-color:var(--pink3)}
.skin-step.done{background:var(--sage);border-color:var(--sage2)}
.skin-step.done .cbox{background:linear-gradient(135deg,#B9CDB3,#8DB585);border-color:transparent;box-shadow:0 3px 8px rgba(141,181,133,.35)}
.skin-step.done .cbox svg{opacity:1;transform:scale(1)}
.skin-step.done .sk-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage2)}
.cal-box{margin-top:6px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--pink2);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.cal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cal-row b{color:#8a4766;white-space:nowrap}
.cal-row.warn{color:#b0677a}
.cal-row.tot{border-top:1px dashed var(--pink3);padding-top:5px;margin-top:3px;font-weight:700;color:#6a4659}
.link-btn{background:none;border:none;color:var(--rose);font-weight:700;font-size:12px;cursor:pointer;padding:0 3px;text-decoration:underline}
.teach-box{margin-top:8px;padding:10px;border-radius:14px;background:#fff;border:1.5px dashed var(--pink3);display:flex;flex-direction:column;gap:8px}
.cal-studio{padding:12px;border-radius:16px;background:linear-gradient(160deg,#fff,var(--bg));border:1px solid var(--pink2);display:flex;flex-direction:column;gap:8px}
.food-res{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding:4px 2px}
.food-item{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.food-qrow{display:flex;flex-wrap:wrap;gap:5px}
.food-qbtn{padding:4px 9px;border-radius:99px;border:1px solid var(--pink2);background:var(--pink1);color:#7e435f;font-size:11.5px;font-weight:700;cursor:pointer}
.food-qbtn:hover{background:var(--pink2)}
.macro-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.macro-pill{padding:3px 9px;border-radius:99px;background:var(--lav);color:#5d467e;font-size:11.5px;font-weight:700}
.ai-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--lav);color:#5d467e;font-size:11px;font-weight:700}
.ai-setup{padding:10px 12px;border-radius:14px;background:#fff;border:1.5px dashed var(--lav2);display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);transition:background .2s,border-color .2s}
.ex-row:hover{background:var(--bg);border-color:var(--pink3)}
.ex-row.done{background:var(--sage);border-color:var(--sage2)}
.ex-ic{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--pink1),var(--lav));display:grid;place-items:center;font-size:20px;flex-shrink:0}
.ex-row.done .ex-ic{background:linear-gradient(135deg,#dcead7,#b9cdb3)}
.ex-day-row.today td{background:linear-gradient(160deg,#fff,var(--pink1))}

/* ---------- PROGRESS ---------- */
.progress{height:10px;background:var(--pink1);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F4C2D6,#D68BAA);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.progress.lav>i{background:linear-gradient(90deg,#e4d8f3,#ae95d3)}
.progress.sage>i{background:linear-gradient(90deg,#d5e5cf,#8DB585)}
.progress.blue>i{background:linear-gradient(90deg,#cfe9f5,#86c1df)}
.progress.thin{height:7px}
.ring{position:relative;width:140px;height:140px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-txt b{font-family:var(--serif);font-size:32px;color:#8a4766;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);min-width:0}
.stat b{font-family:var(--serif);font-size:22px;color:#8a4766;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(130deg,#fff 0%,var(--pink1) 55%,var(--lav) 100%);padding:26px 28px;margin-bottom:18px}
.hero h1{font-size:32px;margin:2px 0 6px}
.hero .motto{font-family:var(--serif);font-style:italic;color:#8d6a7c;font-size:16px;max-width:620px}
.hero-grid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.mode-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.note-soft{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:1px dashed var(--pink3);font-size:14px;color:#86657a}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:linear-gradient(120deg,var(--lav),var(--pink1));border:1px solid var(--line);margin-bottom:18px;cursor:pointer;transition:transform .2s}
.banner:hover{transform:translateY(-2px)}
.banner .bi{font-size:28px}

/* ---------- WATER ---------- */
.glass-wrap{display:flex;justify-content:center;position:relative}
.glass{width:130px;height:180px;border:4px solid #d9cdea;border-top-width:0;border-radius:6px 6px 34px 34px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(243,237,248,.6))}
.glass.sm{width:78px;height:108px;border-width:3px;border-top-width:0;border-radius:4px 4px 22px 22px}
.glass::after{content:"";position:absolute;left:12%;top:8%;width:10%;height:70%;border-radius:10px;background:rgba(255,255,255,.55);z-index:3}
.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#c3e4f3,#93c8e3);transition:height 1.1s cubic-bezier(.2,.8,.2,1);z-index:1}
.water::before,.water::after{content:"";position:absolute;left:-50%;top:-12px;width:200%;height:24px;background:radial-gradient(ellipse at center,#c3e4f3 60%,transparent 62%) repeat-x;background-size:50% 100%;animation:wave 3s linear infinite}
.water::after{opacity:.5;top:-9px;animation-duration:5s;animation-direction:reverse}
.glass-pct{position:absolute;inset:0;display:grid;place-items:center;z-index:4;font-family:var(--serif);font-weight:700;color:#4c7f99;font-size:22px;text-shadow:0 1px 0 #fff}
.glass.sm .glass-pct{font-size:15px}
.drop-fx{position:absolute;top:-30px;left:50%;font-size:22px;z-index:5;animation:dropFall .9s ease-in forwards;pointer-events:none}
.water-btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- MISC LISTS ---------- */
.item-card{display:flex;gap:14px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;position:relative}
.item-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item-card .ph{width:84px;height:84px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--pink1);display:grid;place-items:center;font-size:30px}
.item-card .body{flex:1;min-width:0}
.item-card h4{font-size:16px;margin-bottom:2px;word-break:break-word}
.item-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.list-gap{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty .em{font-size:40px;display:block;margin-bottom:6px;animation:float 4s ease-in-out infinite}
.empty p{margin-bottom:12px;font-weight:600}
.sec-title{font-family:var(--serif);font-size:16px;color:#7a5468;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:700}
.divider{height:1px;background:var(--line);margin:14px 0}
.countdown{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:6px 8px;border-radius:14px;background:linear-gradient(135deg,var(--pink1),var(--lav));font-weight:700;color:#8a4766}
.countdown b{font-family:var(--serif);font-size:22px;line-height:1}
.countdown span{font-size:11px}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td select{padding:6px 8px;font-size:13px;border-radius:10px}
.st-0{background:#f6f1f4!important}.st-1{background:#fff4e2!important}.st-2{background:#e9f3e6!important}.st-3{background:#fde7ee!important}
.plan-grid{display:grid;grid-template-columns:110px repeat(4,1fr);gap:8px;align-items:center}
.plan-grid .ph{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.plan-grid .pd{font-weight:700;font-family:var(--serif);color:#7a5468}
.plan-grid .pd.today{color:var(--rose)}
.plan-grid input{padding:8px 10px;font-size:13.5px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wday{padding:12px 8px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center;cursor:pointer;transition:all .2s}
.wday:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.wday.today{background:linear-gradient(160deg,#fff,var(--pink1));border-color:var(--pink3)}
.wday .dn{font-weight:700;font-size:13px;color:var(--muted)}
.wday .dd{font-family:var(--serif);font-size:22px;color:#7a5468}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:18px;background:var(--bg);border:1px solid var(--line);transition:transform .2s}
.badge .bi{font-size:30px;display:block}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge small{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.badge.locked{opacity:.45;filter:grayscale(.9)}
.badge:not(.locked):hover{transform:translateY(-3px) rotate(-2deg)}

/* ---------- CALENDAR ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cday{min-height:74px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:6px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:2px;position:relative}
.cday:hover{border-color:var(--pink3);transform:translateY(-2px);box-shadow:var(--shadow)}
.cday.blank{background:transparent;border:none;cursor:default}
.cday.blank:hover{transform:none;box-shadow:none}
.cday.today{background:linear-gradient(160deg,#fff,var(--pink1));border-color:var(--rose)}
.cday.sel{outline:2px solid var(--rose)}
.cday .n{font-weight:700;font-size:13px}
.cday .cm{font-size:18px;line-height:1}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.dot{width:7px;height:7px;border-radius:50%}
.dot.r{background:#E8A6C1}.dot.e{background:#d0566f}.dot.s{background:#ae95d3}.dot.m{background:#8DB585}.dot.j{background:#e7b75f}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---------- GARDEN ---------- */
.garden-svg{width:100%;height:auto;display:block;border-radius:20px}
.garden-svg .tree{transform-box:view-box;transform-origin:200px 208px;animation:sway 7s ease-in-out infinite;cursor:pointer}
.garden-svg .tree.wiggle{animation:wiggle .8s ease}
.garden-svg .cloud{animation:drift 40s linear infinite}
.garden-svg .cloud.c2{animation-duration:55s;animation-delay:-20s}
.garden-svg .bf{cursor:pointer}
.garden-svg .bf1{animation:fly1 14s ease-in-out infinite}
.garden-svg .bf2{animation:fly2 18s ease-in-out infinite}
.garden-svg .bf3{animation:fly1 22s ease-in-out infinite reverse}
.garden-svg .wing{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite alternate}
.garden-svg .glow{animation:glow 3s ease-in-out infinite}
.garden-svg .twinkle{animation:twinkle 2.5s ease-in-out infinite}
.garden-svg .fl{transform-box:fill-box;transform-origin:bottom center;animation:sway 5s ease-in-out infinite}
.garden-mini{border-radius:18px;overflow:hidden;cursor:pointer}
.rain-drop{position:absolute;font-size:18px;pointer-events:none;animation:rain 1s ease-in forwards;z-index:5}
.garden-stage{position:relative}
.item-tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.item-tile .ii{font-size:24px}
.item-tile.locked{opacity:.55}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.theme-sw{width:46px;height:46px;border-radius:14px;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .2s}
.theme-sw.on{outline:3px solid var(--rose);transform:scale(1.06)}

/* ---------- READING ---------- */
.reading p{margin-bottom:12px;line-height:1.75}
.reading .msg{padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,var(--pink1),var(--lav));font-family:var(--serif);font-style:italic;color:#7a5468}
.read-prev{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#7d6573;font-size:14px}

/* ---------- CHART ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:10px;fill:#a08896;font-weight:600}
.chart .bar{transition:opacity .2s}
.chart .bar:hover{opacity:.75}
.chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;background:var(--bg);border-radius:16px;border:1px dashed var(--pink3)}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(91,68,80,.36);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;animation:fade .2s ease}
.modal{background:#fff;border-radius:26px;width:100%;max-width:560px;max-height:calc(100% - 16px);display:flex;flex-direction:column;overflow:hidden;padding:0;box-shadow:0 20px 60px rgba(91,68,80,.28);animation:popUp .25s ease}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px;margin-bottom:0;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff,var(--pink1));flex-shrink:0}
.modal-head h2{font-size:21px}
.modal-body{padding:16px 20px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}

/* ---------- WELCOME ---------- */
.welcome{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
  background:radial-gradient(800px 600px at 20% 10%,#fde9f1,transparent 70%),radial-gradient(700px 600px at 90% 90%,#efe6f8,transparent 70%),linear-gradient(160deg,#fff8fa,#fdf1f5 50%,#f6f1fa);animation:fade .5s}
.welcome.out{animation:fadeOut .6s forwards}
.welcome-card{max-width:560px;width:100%;text-align:center;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:32px;padding:34px 28px;box-shadow:0 20px 60px rgba(214,139,170,.2);border:1px solid #fff;position:relative;animation:popUp .7s cubic-bezier(.2,.9,.3,1.1);margin:auto}
.welcome-card h1{font-size:36px;margin:8px 0 12px}
.welcome-card .lead{font-family:var(--serif);font-size:18px;color:#8a5f75;margin-bottom:10px}
.welcome-card .wtext{color:#7d6573;line-height:1.75;margin-bottom:10px}
.welcome-card .en{font-family:var(--serif);font-style:italic;color:var(--dusty);margin:6px 0 14px}
.wquote{margin:14px 0;padding:12px 16px;border-radius:18px;background:linear-gradient(120deg,var(--pink1),var(--lav));font-weight:600;color:#7a5468}
.wfloat{position:absolute;font-size:26px;pointer-events:none;animation:float 7s ease-in-out infinite;opacity:.8}

/* ---------- FX ---------- */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-h);padding:10px 18px;border-radius:999px;font-weight:700;color:#7a5468;animation:toastIn .4s cubic-bezier(.2,.9,.3,1.3);font-size:14px;text-align:center}
.toast.out{animation:fadeOut .4s forwards}
.xp-float{position:fixed;z-index:410;pointer-events:none;font-weight:800;color:var(--rose);font-size:18px;text-shadow:0 2px 0 #fff;animation:xpUp 1.4s ease-out forwards;font-family:var(--serif)}
.confetti{position:fixed;z-index:420;pointer-events:none;width:8px;height:8px;border-radius:2px;animation:confetti 1s ease-out forwards}
.timer-big{font-family:var(--serif);font-size:42px;color:#8a4766;text-align:center;letter-spacing:.02em}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:scale(1.02)}}
@keyframes popUp{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(25%)}}
@keyframes dropFall{0%{transform:translate(-50%,0);opacity:1}80%{opacity:1}100%{transform:translate(-50%,150px) scale(.6);opacity:0}}
@keyframes rain{0%{transform:translateY(0);opacity:1}100%{transform:translateY(140px);opacity:0}}
@keyframes xpUp{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1.5deg)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
@keyframes fly1{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-25px)}50%{transform:translate(80px,5px)}75%{transform:translate(30px,20px)}}
@keyframes fly2{0%,100%{transform:translate(0,0)}30%{transform:translate(-50px,-20px)}60%{transform:translate(-20px,15px)}80%{transform:translate(25px,-10px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

/* ---------- RESPONSIVE (iPhone 11 – iPhone 18 Mobile UX) ---------- */
.btn,.bn,.nav-item,.tab,.chip,.mood,.check-item,.cday,.wday,.skin-step,.card-link{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.topbar .btn.icon.active{background:linear-gradient(135deg,var(--pink2),var(--lav));color:#8a4766;box-shadow:0 3px 10px rgba(214,139,170,.28)}
@media (max-width:1100px){
  .c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7{grid-column:span 12}.c8{grid-column:span 12}
}

  .topbar .btn.icon{width:38px;height:38px;border-radius:13px;font-size:17px}
  .bottom-nav{display:flex;padding:6px calc(6px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));gap:2px}
  .bn{min-height:48px;justify-content:center;padding:4px 1px;border-radius:14px}

  .main{margin-left:0;padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(98px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  .hero{padding:18px 16px}

}

const READINGS = [
 {id:"r1",cat:"Motivasyon",title:"Küçük adımların sessiz gücü",

 {id:"r2",cat:"Psikoloji",title:"Beynimiz neden olumsuzluğa takılır?",

  msg:"Bugün seni gülümseten küçük bir anı fark et ve onu bir süre içinde tut. 💗"},
 {id:"r3",cat:"İnsan vücudu",title:"Kalbin bir günde yaptığı iş",
  p:["Kalbin şu an, sen bu satırları okurken, sessizce çalışıyor. Bir günde yaklaşık 100.000 kez atıyor ve vücudunda binlerce litre kan pompalıyor. Üstelik hiç mola vermeden, sen uyurken bile.",

     "Bir dahaki EKG dersinde o çizgilere baktığında, aslında bir kalbin kendi dilinde anlattığı hikâyeyi okuduğunu hatırla."],

 {id:"r4",cat:"Bilim",title:"Uyurken beynin temizlik yapar",
  p:["Uyku sadece dinlenmek değildir. Bilim insanları, derin uyku sırasında beynin 'glimfatik sistem' adı verilen bir temizlik mekanizmasını hızlandırdığını keşfetti.",
     "Gün boyunca beyin hücreleri çalışırken bazı atık maddeler birikir. Uyku sırasında beyin hücreleri arasındaki boşluklar genişler ve beyin omurilik sıvısı bu atıkları yıkayarak uzaklaştırır. Yani iyi bir uyku, kelimenin tam anlamıyla zihnini temizler.",
     "Ayrıca uyku, gün içinde öğrendiğin bilgilerin kalıcı belleğe aktarıldığı zamandır. Sınavdan önceki gece uykusuz çalışmak yerine uyumak, öğrendiklerini korumanın en akıllıca yoludur."],
  msg:"Bu gece erken uyumak, yarına verebileceğin en güzel hediye olabilir. 🌙"},
 {id:"r5",cat:"İlginç bilgiler",title:"Kemiklerin sürekli yenileniyor",
  p:["İskeletin sabit ve değişmez gibi görünür ama aslında yaşayan, sürekli yenilenen bir dokudur. Osteoklast hücreleri eski kemiği yıkarken, osteoblastlar yenisini inşa eder.",

 {id:"r6",cat:"Üniversite yaşamı",title:"Aralıklı tekrar: daha az çalış, daha çok hatırla",
  p:["Bir konuyu bir gecede on kez okumak mı, yoksa bir hafta boyunca her gün kısa kısa tekrar etmek mi? Bilim ikincisinden yana. Buna 'aralıklı tekrar' denir.",
     "Hermann Ebbinghaus'un unutma eğrisi, öğrendiğimiz bilginin büyük kısmını ilk günlerde unuttuğumuzu gösterir. Ama her tekrar, bu eğriyi yavaşlatır. 1. gün, 3. gün, 7. gün ve 14. gün yapılan kısa tekrarlar, bilgiyi uzun süreli belleğe taşır.",
     "Okulum bölümündeki 'Tekrar planı' tam bunun için var. Bir slaytı bitirdiğinde, birkaç gün sonrasına küçük bir tekrar eklemek sınav haftasını çok daha hafif yapar."],
  msg:"Bugün dün öğrendiğin bir şeyi 5 dakika tekrar et. 📚"},
 {id:"r7",cat:"Kişisel gelişim",title:"Mükemmel yerine ilerleme",
  p:["Mükemmeliyetçilik çoğu zaman bir erdem gibi görünür ama aslında bizi durdurabilir. 'Tam yapamayacaksam hiç yapmayayım' düşüncesi, pek çok güzel başlangıcın önündeki en büyük engeldir.",
     "İlerleme odaklı düşünmek ise şöyle der: 'Bugün yüzde yirmisini yapabildim, bu da sıfırdan fazla.' Bu bakış açısı hem daha sürdürülebilir hem de çok daha şefkatlidir.",
     "Bloom'da bir günü kaçırdığında hiçbir şey sıfırlanmaz, ağacın kurumaz. Çünkü gerçek hayatta da böyledir: yol her zaman oradadır ve sen her an geri dönebilirsin."],
  msg:"Perfect days are not required. Small steps are enough. 🌷"},
 {id:"r8",cat:"Kendine güven",title:"Kendine bir arkadaş gibi konuşmak",
  p:["Zor bir gün geçiren en yakın arkadaşına ne söylerdin? Muhtemelen 'Çok normal, kendine bu kadar yüklenme' derdin. Peki kendine aynı şeyi söylüyor musun?",
     "Psikolog Kristin Neff'in öz-şefkat üzerine çalışmaları, kendine nazik davranan insanların hatalardan daha hızlı toparlandığını ve hedeflerine daha istikrarlı ilerlediğini gösteriyor. Öz-şefkat tembellik değil, dayanıklılıktır.",
     "Bir dahaki sefere iç sesin sertleştiğinde, durup şunu sor: 'Bunu sevdiğim birine söyler miydim?' Cevap hayırsa, cümleni yeniden kur."],

 {id:"r9",cat:"Hayat",title:"Yavaş sabahların büyüsü",
  p:["Alarmın çaldığı an telefonu açıp bildirimlere dalmak, güne başkalarının gündemiyle başlamak demektir. Oysa sabahın ilk on dakikası, günün tonunu belirler.",
     "Pencereyi açmak, bir bardak su içmek, yatağını düzeltmek, birkaç derin nefes almak... Bunlar küçük ama güçlü ritüellerdir. Beynine 'Bu gün benim' mesajı verir.",
     "Yavaş bir sabah için saatlerce erken kalkmana gerek yok. Sadece ilk birkaç dakikayı kendine ayırman yeterli."],
  msg:"Yarın sabah ilk 5 dakikayı telefonsuz geçirmeyi dene. ☀️"},
 {id:"r10",cat:"Sağlıklı alışkanlıklar",title:"Su ve odaklanma arasındaki bağ",
  p:["Beynimizin büyük kısmı sudan oluşur. Hafif bir susuzluk bile dikkat, hafıza ve ruh hâli üzerinde fark edilir etkiler yaratabilir.",
     "Ders çalışırken başının ağırlaştığını, odaklanamadığını hissettiğinde sebep bazen yorgunluk değil, sadece susuzluk olabilir. Masanda bir su şişesi bulundurmak, küçük ama etkili bir alışkanlıktır.",
     "Susamayı beklemek yerine gün boyuna yayılmış küçük yudumlar en iyisidir. Bloom'daki su takibi de bu yüzden var: her bardak hem sana hem bahçene iyi geliyor."],
  msg:"Şu an bir bardak su içmeye ne dersin? 💧"},
 {id:"r11",cat:"Mini hikâyeler",title:"Bambunun sabrı",
  p:["Bir çiftçi bambu tohumu eker. Her gün sular, ilgilenir. Birinci yıl toprağın üstünde hiçbir şey görünmez. İkinci yıl da. Üçüncü, dördüncü yıl... Komşuları ona güler.",
     "Beşinci yıl, bambu toprağı yarıp çıkar ve sadece altı hafta içinde metrelerce boy atar. Komşular şaşırır: 'Altı haftada nasıl bu kadar büyüdü?' Çiftçi gülümser: 'Altı haftada değil, beş yılda büyüdü. Sadece kökleri yerin altındaydı.'",
     "Bazen emeklerinin sonucunu göremezsin. Ama bu, bir şeylerin büyümediği anlamına gelmez. Kökler, görünmeyen yerde güçleniyor olabilir."],
  msg:"Görünmeyen ilerleme de ilerlemedir. Köklerin büyüyor. 🎋"},
 {id:"r12",cat:"İnsan vücudu",title:"Lenf sistemi: vücudun sessiz nehri",
  p:["Kalp kanı pompalar ama lenf sisteminin böyle bir pompası yoktur. Lenf sıvısı, büyük ölçüde kaslarımızın hareketi, nefes alıp vermemiz ve vücut pozisyonumuzla akar.",
     "Bu yüzden hafif ve düzenli hareket, lenf dolaşımı için çok değerlidir. Yürüyüş, yüzme, bacakları yukarı kaldırarak dinlenmek ve derin diyafram nefesi bu sessiz nehrin akışını destekler.",
     "Bedenini dinlemek, onu zorlamadan ama ihmal de etmeden hareket ettirmek, uzun vadede kendine verebileceğin en güzel bakımlardan biridir. Her türlü özel durum için hekiminin önerileri her zaman önceliklidir."],
  msg:"Bugün 10 dakikalık nazik bir yürüyüş, bedenine iyi gelecek. 🌿"},
 {id:"r13",cat:"Psikoloji",title:"5 dakika kuralı",
  p:["Ertelemek çoğu zaman tembellikten değil, görevin bize hissettirdiği duygudan kaçmaktan kaynaklanır. Görev büyük, belirsiz ya da sıkıcı göründüğünde beyin onu bir tehdit gibi algılar.",
     "5 dakika kuralı basittir: 'Sadece 5 dakika yapacağım, sonra istersem bırakırım.' Bu, beynin direncini kırar. Çoğu zaman başladıktan sonra devam etmek, başlamaktan çok daha kolaydır.",
     "5 dakika sonra bıraksan bile, hiç başlamamış olmaktan çok daha ileridesin."],
  msg:"Ertelediğin bir şeye sadece 5 dakika ver. ⏳"},
 {id:"r14",cat:"Bilim",title:"Doğada yürümenin sakinleştirici etkisi",
  p:["Japonya'da 'shinrin-yoku', yani orman banyosu, uzun zamandır bir sağlık pratiği olarak kabul ediliyor. Araştırmalar, ağaçların arasında geçirilen zamanın stres hormonu kortizolü düşürebildiğini gösteriyor.",
     "Bunun için ormana gitmen gerekmiyor. Bir parkta yürümek, bir ağaca bakmak, hatta pencereden yeşilliği izlemek bile zihni yavaşlatır.",
     "Belki de sanal bahçenin sana iyi gelmesinin sebebi budur: insan, büyüyen bir şeye bakınca sakinleşir."],
  msg:"Bugün bir ağaca ya da çiçeğe bir dakika gerçekten bak. 🌳"},
 {id:"r15",cat:"Mini hikâyeler",title:"Deniz yıldızları",
  p:["Fırtınadan sonra sahile binlerce deniz yıldızı vurmuş. Küçük bir kız tek tek onları alıp denize geri atıyormuş. Yaşlı bir adam yaklaşmış: 'Binlerce var, hepsini kurtaramazsın. Ne fark eder ki?'",
     "Kız bir deniz yıldızını daha denize atmış ve gülümsemiş: 'Bunun için fark etti.'",
     "Sağlık alanında çalışmak da biraz böyledir. Herkesi kurtaramazsın ama dokunduğun her hayat için fark yaratırsın. Ve bu, kendine yaptığın küçük iyilikler için de geçerli."],
  msg:"Yaptığın her küçük iyilik bir fark yaratır. 🌟"},
 {id:"r16",cat:"Üniversite yaşamı",title:"Okumak yerine kendine sor",

  msg:"Bugün çalıştığın konudan kendine 3 soru sor. ❓"},
 {id:"r17",cat:"Kendine güven",title:"Karşılaştırma tuzağı",
  p:["Sosyal medyada gördüğümüz şey, insanların hayatlarının en parlak karelerinden oluşan bir vitrindir. Biz ise kendi hayatımızın kamera arkasını, dağınık odasını, yorgun sabahlarını biliriz.",

     "Karşılaştırma yapacaksan, tek adil karşılaştırma şudur: Geçen ayki sen ile bugünkü sen."],
  msg:"Bugün sadece dünkü kendinle kıyasla ve farkı kutla. 🌸"},
 {id:"r18",cat:"Sağlıklı alışkanlıklar",title:"Akdeniz sofrasının sırrı",
  p:["Akdeniz tipi beslenme bir diyet değil, bir yaşam tarzıdır: bol sebze, zeytinyağı, baklagiller, tam tahıllar, balık, yoğurt, ceviz ve mevsim meyveleri.",
     "Bu beslenme biçimi, yasaklar yerine 'ekleme' mantığıyla çalışır. Tabağına bir avuç yeşillik eklemek, öğününe bir protein kaynağı koymak, zeytinyağlı bir sebze yemeği seçmek... Hepsi küçük ama besleyici adımlar.",
     "Ve en önemlisi: Akdeniz sofrası yavaş yenir, paylaşılır, keyif alınır. Yemek bir suçluluk kaynağı değil, kendine gösterilen bir özendir."],
  msg:"Bugünkü tabağına bir renk daha ekle. 🥗"},
 {id:"r19",cat:"İlginç bilgiler",title:"EKG'nin doğuşu",
  p:["1903 yılında Hollandalı fizyolog Willem Einthoven, kalbin elektriksel aktivitesini kaydedebilen bir cihaz geliştirdi. İlk cihaz yaklaşık 270 kilo ağırlığındaydı ve çalıştırmak için beş kişi gerekiyordu!",
     "Hastalar ellerini ve ayaklarını tuzlu su dolu kovalara sokuyordu; bunlar elektrot görevi görüyordu. Einthoven, bugün hâlâ kullandığımız P, Q, R, S ve T harflendirmesini de bulan kişidir ve 1924'te Nobel Ödülü aldı.",
     "Bugün cebe sığan monitörlerle saniyeler içinde EKG çekebiliyoruz. Senin öğrendiğin her ritim, yüz yılı aşkın bir merakın mirası."],
  msg:"Öğrendiğin bilgiler, bir zamanlar birinin büyük hayaliydi. 📈"},
 {id:"r20",cat:"Hayat",title:"Dinlenmek de üretkenliktir",
  p:["Sürekli bir şey yapıyor olma baskısı, dinlenmeyi bir 'boşa geçen zaman' gibi hissettirebilir. Oysa sporcular bilir: kaslar antrenman sırasında değil, dinlenirken güçlenir.",
     "Zihin de böyledir. Yürüyüşe çıkmak, bir şey yapmadan pencereden bakmak, erken uyumak; bunlar beynin bilgiyi işlediği ve yaratıcılığın filizlendiği anlardır.",
     "Bloom'daki 'Dinlenme günü' modu bu yüzden var. Bazı günler sadece temel şeyleri yapmak, kendine bakmanın en olgun hâlidir."],
  msg:"Bugün dinlenmeye ihtiyacın varsa, bu da bir başarı. ☁️"},
 {id:"r21",cat:"Kişisel gelişim",title:"Kimlik temelli alışkanlıklar",
  p:["'Su içmeliyim' demek ile 'Ben kendine iyi bakan biriyim' demek arasında ince ama güçlü bir fark vardır. İlki bir görevdir; ikincisi bir kimlik.",
     "James Clear'ın da vurguladığı gibi, kalıcı alışkanlıklar ne yapmak istediğimizden çok kim olmak istediğimizle ilgilidir. Her küçük eylem, olmak istediğin kişi için atılmış bir oydur.",
     "Bir bardak su içtiğinde, bir slayt bitirdiğinde, odanı toparladığında aslında şunu söylüyorsun: 'Ben kendine önem veren biriyim.'"],
  msg:"Bugün olmak istediğin kişi için küçük bir oy ver. 🗳️"},
 {id:"r22",cat:"Psikoloji",title:"Duygulara isim vermek",
  p:["UCLA'da yapılan araştırmalar, bir duyguyu kelimelerle tanımlamanın beynin alarm merkezi olan amigdaladaki aktiviteyi azaltabildiğini gösterdi. Buna 'duyguyu etiketleme' denir.",
     "'Kötüyüm' demek yerine 'Kaygılıyım çünkü sınav yaklaşıyor' ya da 'Yorgunum ve biraz yalnız hissediyorum' demek, duyguyu daha yönetilebilir kılar.",
     "Günlüğünde ruh hâlini seçmek ve birkaç cümle yazmak, bu yüzden sandığından çok daha güçlü bir alışkanlık."],
  msg:"Şu an ne hissettiğine bir isim ver. Sadece fark et. 🤍"}

function load() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { p = null; }
  return p ? merge(defaults(), p) : defaults();
}
function merge(d, p) {
  const o = Object.assign({}, d, p);
  ["settings","garden","xp","routines","skincare"].forEach(k => o[k] = Object.assign({}, d[k], p[k] || {}));
  if (o.settings.passGrade === undefined || o.settings.passGrade === null || isNaN(+o.settings.passGrade)) o.settings.passGrade = 60;
  if (!o.settings.aiModel) o.settings.aiModel = d.settings.aiModel;
  if (!Array.isArray(o.settings.schoolDays)) o.settings.schoolDays = d.settings.schoolDays;
  if (!Array.isArray(o.settings.meds)) o.settings.meds = [];
  ["school","off","evening"].forEach(k => { if (!Array.isArray(o.routines[k]) || !o.routines[k].length) o.routines[k] = d.routines[k]; });
  const sameDayLists = Array.isArray(o.routines.school) && Array.isArray(o.routines.off) &&
    o.routines.school.length === o.routines.off.length &&
    o.routines.school.every((x, i) => o.routines.off[i] && x.text === o.routines.off[i].text);
  if (sameDayLists || (o.routines.school[0] && o.routines.school[0].text === "Uyan")) {
    o.routines.off = d.routines.off;
    if (o.routines.school[0] && o.routines.school[0].text === "Uyan") {
      o.routines.school = d.routines.school;
      o.routines.evening = d.routines.evening;
    }
  }
  if (!o.skinRoutineMigrated) {
    [["school", 3], ["evening", 2]].forEach(([rk, lvl]) => {
      const list = o.routines[rk];
      if (Array.isArray(list) && !list.some(x => /cilt bakım/i.test(x && x.text || ""))) {
        const idx = list.findIndex(x => /diş/i.test(x && x.text || ""));
        const item = r("Cilt bakımımı yap", lvl);
        if (idx >= 0) list.splice(idx + 1, 0, item);
        else list.push(item);
      }
    });
    o.skinRoutineMigrated = true;
  }
  ["morning","evening"].forEach(t => {
    if (!Array.isArray(o.skincare[t]) || !o.skincare[t].length) {
      o.skincare[t] = d.skincare[t];
    } else {
      d.skincare[t].filter(x => x.fixed).forEach((fx, fi) => {
        if (!o.skincare[t].some(x => x && (x.id === fx.id || x.step === fx.step))) {
          o.skincare[t].splice(Math.min(fi, o.skincare[t].length), 0, Object.assign({}, fx));
        }
      });
    }
  });
  if (!o.exercise || typeof o.exercise !== "object") o.exercise = d.exercise;
  if (!o.exercise.plan || typeof o.exercise.plan !== "object") o.exercise.plan = d.exercise.plan;
  [1,2,3,4,5,6,7].forEach(i => { if (!Array.isArray(o.exercise.plan[i])) o.exercise.plan[i] = []; });
  if (!Array.isArray(o.exercise.logs)) o.exercise.logs = [];
  if (!Number.isFinite(Number(o.exercise.presetAge)) || !o.exercise.presetAge) o.exercise.presetAge = null;
  if (typeof o.exercise.presetLabel !== "string") o.exercise.presetLabel = "";
  if (!Number.isFinite(Number(o.exercise.presetGoalMin)) || !o.exercise.presetGoalMin) o.exercise.presetGoalMin = null;
  ["days","mealPlan","bonusWeeks"].forEach(k => { if (!o[k] || typeof o[k] !== "object") o[k] = {}; });
  ["meals","exams","grades","study","progress","qlog","courses","favorites","customFoods"].forEach(k => { if (!Array.isArray(o[k])) o[k] = d[k]; });
  if (!o.clearedPresetCourses && Array.isArray(o.courses)) {
    const usedCourseIds = new Set([
      ...(o.exams || []).map(x => x && x.courseId),
      ...(o.grades || []).map(x => x && x.courseId),
      ...(o.study || []).map(x => x && x.courseId)
    ].filter(Boolean));
    o.courses = o.courses.filter(c => {
      if (!c || !LEGACY_PRESET_COURSES.includes(c.name)) return true;
      return (
        usedCourseIds.has(c.id) ||
        !!(c.instructor && c.instructor.trim()) ||
        !!(c.examDate && c.examDate.trim()) ||
        !!(c.desc && c.desc.trim()) ||
        !!(c.notes && c.notes.trim()) ||
        (Array.isArray(c.covered) && c.covered.length > 0) ||
        (Array.isArray(c.todo) && c.todo.length > 0) ||
        (Array.isArray(c.weeks) && c.weeks.length > 0) ||
        (Array.isArray(c.review) && c.review.length > 0)
      );
    });
    o.clearedPresetCourses = true;
  }
  o.courses.forEach(c => {
    ["covered","todo","weeks","review"].forEach(f => { if (!Array.isArray(c[f])) c[f] = []; });
    if (c.ects === undefined || c.ects === null || isNaN(+c.ects) || +c.ects <= 0) c.ects = 3;
  });
  o.appVersion = APP_VERSION;
  return o;
}

  return {i, name: STAGES[i].n, e: STAGES[i].e, next, pct: next ? Math.round((g - STAGES[i].at) / (next.at - STAGES[i].at) * 100) : 100};
}

}

  if (S.xp.log.length > 5000) S.xp.log = S.xp.log.slice(-5000);

}

  if (good >= 5) { S.bonusWeeks[ws] = true; award("weekbonus", 50, "Haftalık hedef bonusu 🎁", 10); toast("Bu hafta 5 gün yarıdan fazlasını tamamladın! +50 bonus XP 🎁"); }
}

function lineChart(data, {h = 150, color = "#D68BAA", fmt = v => v, empty = "Grafik için en az iki kayıt gerekli 🌱"} = {}) {
  const pts = data.map((d, i) => ({...d, i})).filter(d => d.v !== null && d.v !== undefined && d.v !== "" && !isNaN(d.v));
  if (pts.length < 2) return `<div class="chart-empty">${empty}</div>`;

  const X = i => l + (data.length === 1 ? 0 : i / (data.length - 1) * (W - l - rr)), Y = v => top + ch - (v - mn) / (mx - mn) * ch;

  const gid = "lg" + Math.random().toString(36).slice(2, 7);

  s += `<path d="${path} L${X(pts[pts.length - 1].i).toFixed(1)} ${top + ch} L${X(pts[0].i).toFixed(1)} ${top + ch} Z" fill="url(#${gid})"/>`;

  return s + "</svg>";
}

const GRADE_TYPES = [{t:"Vize",w:40},{t:"Final",w:60},{t:"Bütünleme",w:60},{t:"Quiz",w:10},{t:"Ödev",w:10},{t:"Uygulama",w:20},{t:"Diğer",w:20}];
const passGrade = () => { const v = +(S && S.settings ? S.settings.passGrade : 60); return (v >= 1 && v <= 100) ? v : 60; };
const courseEcts = id => { const c = S.courses.find(x => x.id === id); const v = c ? +c.ects : 0; return v > 0 ? v : 1; };
function letterGrade(avg, pg = passGrade()) {
  if (avg < pg) return {l:"FF",gpa:0.0,cls:"red",passed:false};
  if (avg >= 90) return {l:"AA",gpa:4.0,cls:"sage",passed:true};
  if (avg >= 85) return {l:"BA",gpa:3.5,cls:"sage",passed:true};
  if (avg >= 80) return {l:"BB",gpa:3.0,cls:"sage",passed:true};
  if (avg >= 75) return {l:"CB",gpa:2.5,cls:"lav",passed:true};
  if (avg >= 70) return {l:"CC",gpa:2.0,cls:"lav",passed:true};
  if (avg >= 65) return {l:"DC",gpa:1.5,cls:"cream",passed:true};
  return {l:"DD",gpa:1.0,cls:"cream",passed:true};
}
function courseGradeSummary(courseId) {
  const pg = passGrade(), ects = courseEcts(courseId);
  const all = S.grades.filter(g => (g.courseId || "") === (courseId || ""));
  const hasBut = all.some(g => g.type === "Bütünleme");
  const active = hasBut ? all.filter(g => g.type !== "Final") : all;
  const wSum = active.reduce((a, g) => a + (+g.weight || 0), 0);
  const weighted = active.reduce((a, g) => a + (+g.score || 0) * (+g.weight || 0), 0);
  const avg = wSum > 0 ? Math.round((weighted / wSum) * 10) / 10 : null;
  const hasFinal = active.some(g => g.type === "Final" || g.type === "Bütünleme");
  let needPass = null, need85 = null;
  if (!hasFinal && wSum > 0 && wSum < 100) {
    const rem = 100 - wSum;
    needPass = Math.max(0, Math.ceil((pg * 100 - weighted) / rem));
    need85 = Math.max(0, Math.ceil((8500 - weighted) / rem));
  }
  return {all, active, hasBut, wSum, avg, letter: avg !== null ? letterGrade(avg, pg) : null, hasFinal, needPass, need60: needPass, passGrade: pg, ects, passed: avg !== null ? avg >= pg : null, need85};
}

  const withGrades = cIds.map(id => { const sum = courseGradeSummary(id); return {id, name: courseName(id), ects: sum.ects, sum}; }).filter(x => x.sum.all.length > 0);
  const valid = withGrades.filter(x => x.sum.avg !== null);
  const totalEcts = valid.reduce((a, x) => a + x.ects, 0);
  const overallAvg = totalEcts ? Math.round((valid.reduce((a, x) => a + x.sum.avg * x.ects, 0) / totalEcts) * 10) / 10 : null;
  const overallGpa = totalEcts ? (valid.reduce((a, x) => a + x.sum.letter.gpa * x.ects, 0) / totalEcts).toFixed(2) : "—";
  return `<div class="row between mb"><h3 style="font-size:19px">🎓 Sınav notlarım</h3><div class="row" style="gap:8px"><button class="btn soft sm" data-act="go" data-page="settings">⚙️ AKTS &amp; Geçme notu</button><button class="btn" data-act="gradeForm">+ Not ekle</button></div></div>
    ${!S.grades.length ? `<div class="card">${emptyBox("🎓", "Henüz sınav notu girmedin. Vize, final veya quiz notlarını ekleyip ortalamanı takip edebilirsin.", `<button class="btn" data-act="gradeForm">+ İlk notu ekle</button>`)}</div>`
    : `<div class="grid">
      <div class="card c5 tint-pink"><h3>📊 Genel özet</h3>
        <div class="stats">
          <div class="stat"><b>${overallAvg !== null ? overallAvg : "—"}</b><span>AKTS ortalaması (/100)</span></div>
          <div class="stat"><b>${overallGpa}</b><span>AKTS GNO (/4.0)</span></div>
          <div class="stat"><b>${totalEcts}</b><span>not girilen AKTS</span></div>
          <div class="stat"><b>${pg}</b><span>geçme notum 🎯</span></div>
        </div>
        <p class="tiny muted mt">Genel ortalama ve GNO, Ayarlar → Derslerim'deki AKTS kredilerine göre ağırlıklı hesaplanır; bütünleme girilirse final yerine geçer.</p>
      </div>
      <div class="card c7"><h3>📈 Ders ortalamaları</h3>
        ${valid.length ? barChart(valid.slice(0, 8).map(x => ({l: x.name.slice(0, 7), v: x.sum.avg})), {goal: pg, color: "url(#bgLav)", fmt: v => v}) : `<div class="chart-empty">Grafik için ağırlıklı not ekle 🎓</div>`}
      </div>
      ${withGrades.map(({id, name, ects, sum}) => `<div class="card c6">
        <div class="row between" style="align-items:flex-start">
          <div><h3 style="margin-bottom:2px">${esc(name)}</h3><div class="tiny muted">Toplam ağırlık: %${sum.wSum} · ${ects} AKTS</div></div>
          <div class="row" style="gap:6px">${sum.avg !== null ? `<span class="tag ${sum.letter.cls}" style="font-size:14px">${sum.avg} · ${sum.letter.l}</span>` : ""}${(sum.hasFinal || sum.wSum >= 100) && sum.passed !== null ? `<span class="tag ${sum.passed ? "sage" : "red"}">${sum.passed ? "✓ Geçti" : "✗ Kaldı"}</span>` : ""}<button class="btn soft sm" data-act="gradeForm" data-course="${esc(id)}">+ Not</button></div>
        </div>
        ${sum.avg !== null ? `<div class="progress thin mt-s ${sum.avg >= pg ? "sage" : ""}"><i style="width:${Math.min(100, sum.avg)}%"></i></div>` : ""}
        ${sum.needPass !== null ? `<div class="note-soft mt-s small">🎯 Geçmek (${pg}) için kalan %${100 - sum.wSum}'de <b>${sum.needPass > 100 ? "100+" : sum.needPass}</b>${pg < 85 ? ` · BA (85) için <b>${sum.need85 > 100 ? "100+" : sum.need85}</b>` : ""} gerekiyor.</div>` : ""}
        <div class="list-gap mt">${sum.all.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(g => {
          const sup = sum.hasBut && g.type === "Final";
          return `<div class="item-tile" style="${sup ? "opacity:.55" : ""}">
            <div class="grow"><b>${esc(g.type)}</b> <span class="tag lav">${esc(g.score)}</span> <span class="tag">%${esc(g.weight)}</span> ${sup ? `<span class="tiny muted">(Bütünleme geçerli)</span>` : ""}
              <div class="tiny muted">${g.date ? fmtShort(g.date) : ""}${g.note ? (g.date ? " · " : "") + esc(g.note) : ""}</div></div>
            <button class="btn icon sm soft" data-act="gradeForm" data-id="${g.id}" title="Düzenle">✏️</button>
            <button class="btn icon sm danger" data-act="gradeDel" data-id="${g.id}" title="Sil">🗑</button>
          </div>`;
        }).join("")}</div>
      </div>`).join("")}
    </div>`}`;
}
function schoolStudy() {

      ${recent.map(s => `<tr><td>${fmtShort(s.date)}</td><td>${esc(courseName(s.courseId))}</td><td><span class="tag lav">${s.minutes} dk</span></td><td>${esc(s.topic || "")}</td><td><button class="btn icon sm danger" data-act="studyDel" data-id="${s.id}">🗑</button></td></tr>`).join("")}</tbody></table></div>`

function courseDetail(c) {

        <div class="stat"><b>${st.min}</b><span>dk çalışma</span></div><div class="stat"><b>${gs.avg !== null ? `${gs.avg} (${gs.letter.l})` : "—"}</b><span>not ortalaması</span></div></div>

        <div class="sec-title">📅 Sınavlar</div>${exs.length ? exs.map(e => `<div class="small">• <b>${esc(e.name)}</b> – ${fmtShort(e.date)} ${e.date >= today() ? `<span class="tag">${diffDays(today(), e.date)} gün</span>` : ""}</div>`).join("") : `<div class="small muted">Sınav eklenmedi.</div>`}
        <button class="btn soft sm mt" data-act="examForm" data-course="${c.id}">+ Sınav ekle</button></div></div>`;
  } else if (UI.courseTab === "topics") {
    body = `<div class="grid"><div class="card c6 tint-sage"><h3>✅ İşlenen konular</h3>
        <p class="tiny muted mb" style="margin-top:-6px">Buraya eklediğin her konu otomatik olarak Çalışılacak konulara ve Slayt seçeneklerine de eklenir.</p>
        <form class="inline-form" data-form="topicAdd"><input type="hidden" name="type" value="covered"><input name="text" placeholder="İşlenen konu…" required maxlength="120"><button class="btn sage sm" type="submit">Ekle</button></form>
        <div class="list-gap mt">${c.covered.map(t => `<div class="item-tile"><span>📗</span><span class="grow">${esc(t.text)}</span><span class="tiny muted">${fmtShort(t.date)}</span><button class="btn icon sm soft" data-act="topicDel" data-type="covered" data-id="${t.id}">✕</button></div>`).join("") || `<div class="small muted">Henüz konu eklenmedi.</div>`}</div></div>
      <div class="card c6 tint-lav"><h3>📌 Çalışılacak konular</h3>
        <form class="inline-form" data-form="topicAdd"><input type="hidden" name="type" value="todo"><input name="text" placeholder="Çalışılacak konu…" required maxlength="120"><button class="btn lav sm" type="submit">Ekle</button></form>
        <div class="check-list mt">${c.todo.map(t => checkRow({id: t.id, text: t.text, done: t.done, act: "topicToggle", del: `<button type="button" class="btn icon sm soft x" data-act="topicDel" data-type="todo" data-id="${t.id}">✕</button>`})).join("") || `<div class="small muted">Henüz konu eklenmedi.</div>`}</div></div></div>`;
  } else if (UI.courseTab === "weeks") {
    const weeks = c.weeks.slice().sort((a, b) => b.num - a.num);
    body = `<div class="row between mb"><p class="small muted">Her hafta işlenen slaytları ve ders takibini buraya ekle.</p><button class="btn" data-act="weekForm">+ Yeni hafta</button></div>
      ${weeks.length ? `<div class="list-gap">${weeks.map(w => weekCard(c, w)).join("")}</div>` : `<div class="card">${emptyBox("🗂️", "İlk haftanı oluştur, slaytlarını eklemeye başla.", `<button class="btn" data-act="weekForm">+ Yeni hafta</button>`)}</div>`}`;
  } else {
    const rv = c.review.slice().sort((a, b) => (a.done - b.done) || (a.date || "").localeCompare(b.date || ""));
    body = `<div class="card"><h3>🔁 Tekrar planı</h3><p class="small muted mb">Aralıklı tekrar: 1, 3, 7 ve 14 gün sonra kısa tekrarlar bilgiyi kalıcı yapar. Tekrarlar takvimde de görünür.</p>
      <form class="row" data-form="reviewAdd" style="flex-wrap:nowrap"><input name="text" placeholder="Ne tekrar edilecek?" required maxlength="120"><input type="date" name="date" value="${addDays(today(), 1)}" style="width:170px" required><button class="btn sm" type="submit">Ekle</button></form>
      <label class="small row mt-s" style="cursor:pointer"><input type="checkbox" name="spaced" form="none" id="spacedChk"> 1-3-7-14 gün aralıklı tekrar olarak 4 kayıt oluştur</label>
      <div class="check-list mt">${rv.map(x => checkRow({id: x.id, text: x.text, time: (x.date && x.date <= today() && !x.done ? "⏰ " : "") + fmtShort(x.date), done: x.done, act: "reviewToggle", del: `<button type="button" class="btn icon sm soft x" data-act="reviewDel" data-id="${x.id}">✕</button>`})).join("") || emptyBox("🔁", "Henüz tekrar planı yok.")}</div></div>`;
  }
  return `<div class="page-head"><div><span class="card-link" data-act="closeCourse">← Derslerim</span><h1 style="margin-top:4px">${esc(c.name)}</h1><p>${c.instructor ? "👩‍🏫 " + esc(c.instructor) + " · " : ""}${st.done}/${st.slides} slayt tamamlandı</p></div>
    <div class="row">${ne ? countdown(ne.date) : ""}<button class="btn lav sm" data-act="studyForm" data-course="${c.id}">⏱ Çalışma kaydı</button><button class="btn danger sm" data-act="courseDel" data-id="${c.id}">Dersi sil</button></div></div>
    <div class="tabs">${tabs.map(([t, l]) => `<div class="tab ${UI.courseTab === t ? "active" : ""}" data-act="courseTab" data-t="${t}">${l}</div>`).join("")}</div>${body}`;
}
function weekCard(c, w) {
  const sl = w.slides || [], done = sl.filter(s => s.status === 2).length;
  const listTags = (label, txt, cls) => lines(txt).length ? `<div class="small mt-s"><b class="muted">${label}:</b> ${lines(txt).map(x => `<span class="tag ${cls}" style="margin:2px">${esc(x)}</span>`).join("")}</div>` : "";
  return `<div class="card"><div class="row between"><div><h3 style="margin:0">${w.num}. Hafta – ${esc(w.title || c.name)}</h3><div class="small muted">${w.date ? fmtLong(w.date) : ""} · ${done}/${sl.length} slayt tamam</div></div>
    <div class="row"><button class="btn sm" data-act="slideForm" data-week="${w.id}">+ Slayt</button><button class="btn soft sm" data-act="trackForm" data-week="${w.id}">📋 Haftalık takip</button><button class="btn icon sm soft" data-act="weekForm" data-id="${w.id}" title="Düzenle">✏️</button><button class="btn icon sm danger" data-act="weekDel" data-id="${w.id}" title="Sil">🗑</button></div></div>
    <div class="progress thin mt"><i style="width:${sl.length ? done / sl.length * 100 : 0}%"></i></div>
    ${sl.length ? `<div class="table-wrap mt"><table class="t"><thead><tr><th>No</th><th>Slayt</th><th>İşlendiği tarih</th><th>Durum</th><th>Notlar</th><th></th></tr></thead><tbody>
      ${sl.map(s => `<tr><td>${esc(s.no || "")}</td><td><b>${esc(s.name)}</b></td><td>${fmtShort(s.date)}</td>
        <td><select class="st-${s.status || 0}" data-chg="slideStatus" data-week="${w.id}" data-id="${s.id}">${SLIDE_ST.map((t, i) => `<option value="${i}" ${(s.status || 0) === i ? "selected" : ""}>${t}</option>`).join("")}</select></td>
        <td class="small muted">${esc(s.notes || "")}</td><td style="white-space:nowrap"><button class="btn icon sm soft" data-act="slideForm" data-week="${w.id}" data-id="${s.id}">✏️</button><button class="btn icon sm danger" data-act="slideDel" data-week="${w.id}" data-id="${s.id}">🗑</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="small muted mt">Bu haftaya henüz slayt eklenmedi.</div>`}
    <div class="divider"></div>
    <div class="row" style="gap:6px"><span class="tag lav">✏️ Çözülen: ${+w.solved || 0}</span><span class="tag red">✗ Yanlış: ${+w.wrong || 0}</span>${+w.solved ? `<span class="tag sage">✓ Doğru: %${Math.round(((+w.solved) - (+w.wrong || 0)) / (+w.solved) * 100)}</span>` : ""}</div>
    ${listTags("İşlenen konular", w.covered, "sage")}${listTags("Çalışılacak", w.todo, "lav")}${listTags("Tamamlanan", w.done, "sage")}${listTags("Eksik konular", w.missing, "cream")}${listTags("Tekrar yapılacak", w.review, "red")}</div>`;
}

/* ---------------- TAKVİM ---------------- */
function calendarHTML(mode = "day") {
  const now = new Date(), y = UI.calY ?? now.getFullYear(), m = UI.calM ?? now.getMonth();
  const firstDow = (new Date(y, m, 1).getDay() || 7) - 1;
  const daysInM = new Date(y, m + 1, 0).getDate();
  const t = today(), sel = mode === "journal" ? (UI.jDate || t) : t;
  const examDates = new Set(S.exams.map(e => e.date));
  const studyDates = new Set([...S.study.map(s => s.date), ...S.courses.flatMap(c => c.review.map(x => x.date))]);
  const mealDates = new Set(S.meals.map(x => x.date));
  let cells = "";
  for (let i = 0; i < firstDow; i++) cells += `<div class="cday blank"></div>`;
  for (let dayN = 1; dayN <= daysInM; dayN++) {
    const k = `${y}-${pad(m + 1)}-${pad(dayN)}`;
    const dv = dayR(k), mo = MOODS.find(x => x.k === dv.mood);
    const hasR = Object.values(dv.checks || {}).some(Boolean) || (dv.goals || []).some(g => g.done);
    const hasE = examDates.has(k), hasS = studyDates.has(k), hasM = mealDates.has(k) || PLAN_SLOTS.some(s => (S.mealPlan[dow1(k)] || {})[s.k]);
    const hasJ = !!(dv.journal && ((dv.journal.text || "").trim() || J_QS.some(([q]) => (dv.journal[q] || "").trim())));
    cells += `<div class="cday ${k === t ? "today" : ""} ${k === sel ? "sel" : ""}" data-act="${mode === "journal" ? "jSelect" : "dayModal"}" data-k="${k}">
      <div class="n">${dayN}</div>${mo ? `<div class="cm">${mo.e}</div>` : ""}
      <div class="dots">${hasR ? `<i class="dot r" title="Rutin"></i>` : ""}${hasE ? `<i class="dot e" title="Sınav"></i>` : ""}${hasS ? `<i class="dot s" title="Ders/Çalışma"></i>` : ""}${hasM ? `<i class="dot m" title="Beslenme/Plan"></i>` : ""}${hasJ ? `<i class="dot j" title="Günlük"></i>` : ""}</div></div>`;
  }
  return `<div class="cal-head"><button class="btn icon soft sm" data-act="calNav" data-dir="-1" aria-label="Önceki ay">‹</button>
      <h3>${TR_MONTHS[m]} ${y}</h3>
      <div class="row" style="gap:6px"><button class="btn soft sm" data-act="calToday">Bugün</button><button class="btn icon soft sm" data-act="calNav" data-dir="1" aria-label="Sonraki ay">›</button></div></div>
    <div class="cal">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(w => `<div class="wd">${w}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i class="dot r"></i>Rutin</span><span><i class="dot e"></i>Sınav</span><span><i class="dot s"></i>Ders/Tekrar</span><span><i class="dot m"></i>Beslenme</span><span><i class="dot j"></i>Günlük</span></div>`;
}

function openWeekReport(ws = weekStart(today())) {
  const days = weekDays(ws), end = days[6], t = today(), pastDays = days.filter(k => k <= t);
  const routinesDone = days.reduce((a, k) => a + dayStats(k).mDone + dayStats(k).eDone, 0);
  const avgWater = Math.round(pastDays.reduce((a, k) => a + waterTotal(k), 0) / Math.max(1, pastDays.length));
  const mealsW = S.meals.filter(m => m.date >= ws && m.date <= end);
  const studyW = S.study.filter(s => s.date >= ws && s.date <= end);
  const studyMins = studyW.reduce((a, s) => a + (+s.minutes || 0), 0);
  const studiedCourses = [...new Set(studyW.map(s => courseName(s.courseId)))];
  const slidesDoneW = allSlides().filter(s => s.status === 2 && s.doneDate && s.doneDate >= ws && s.doneDate <= end).length;
  const qW = (S.qlog || []).filter(q => q.d >= ws && q.d <= end).reduce((a, q) => a + (+q.n || 0), 0);
  const moveMins = days.reduce((a, k) => a + (+(dayR(k).move || {}).min || 0), 0);
  const moveSteps = days.reduce((a, k) => a + (+(dayR(k).move || {}).steps || 0), 0);
  const gGrowth = days.reduce((a, k) => a + (dayR(k).growth || 0), 0);
  const xpW = weekXP(ws);
  openModal("Haftalık değerlendirmem 🌷", `
    <div class="row between mb"><button class="btn icon soft sm" data-act="weekReport" data-ws="${addDays(ws, -7)}">‹</button>
      <b>${fmtShort(ws)} – ${fmtShort(end)}</b>

      <div class="stat"><b>${fmtMl(avgWater)}</b><span>günlük ort. su 💧</span></div>
      <div class="stat"><b>${mealsW.length}</b><span>kaydedilen öğün 🥗</span></div>

function resolveFormCourseId(fd) {
  let cid = fd.get("courseId") || "";
  const newName = (fd.get("newCourseName") || "").trim();
  if (cid === "__new__" || (!cid && newName)) {
    if (!newName) return "";
    const existing = S.courses.find(c => trNorm(c.name) === trNorm(newName));
    if (existing) return existing.id;
    const ects = Math.max(0.5, Math.min(30, +fd.get("newCourseEcts") || 3));
    const created = newCourse(newName, ects);
    S.courses.push(created);
    return created.id;
  }
  return cid;
}

const normTopic = s => trNorm(s).replace(/\s+/g, " ").trim();
function courseTopicsList(c) {
  c = c || S.courses.find(x => x.id === UI.course);
  if (!c) return [];
  const seen = new Set(), out = [];
  const add = (arr, kind) => (arr || []).forEach(t => {
    const txt = (t.text || "").trim();
    const k = normTopic(txt);
    if (txt && !seen.has(k)) { seen.add(k); out.push({text: txt, kind}); }
  });
  add(c.covered, "covered");
  add(c.todo, "todo");
  return out;
}

function exPlanView() {
  return `<div class="card mb tint-pink">

      <p class="small muted mb">Yaşına ve cinsiyet profiline göre önerilen plan yukarıdaki yaş çiplerinden yüklenir. Bu genel şablonları da kendi temposuna göre düzenleyebilirsin.</p>
      <div class="row" style="gap:8px">${Object.entries(EX_PRESETS).map(([k2, o]) => `<button class="btn soft sm" data-act="exLoadPreset" data-k="${k2}">${o.e} ${esc(o.n)}</button>`).join("")}</div>

            <div class="row" style="gap:4px;flex-shrink:0"><button class="btn icon sm soft" data-act="exPlanForm" data-day="${d1}" data-id="${p.id}" title="Düzenle">✏️</button><button class="btn icon sm danger" data-act="exPlanDel" data-day="${d1}" data-id="${p.id}" title="Sil">🗑</button></div></div>`;

function exPlanFormHTML(dayIdx = 1, item = {}) {
  const tp = item.type || "yuruyus", dVal = +dayIdx || 1;
  return `<form data-form="exPlan" class="form-grid"><input type="hidden" name="id" value="${esc(item.id || "")}"><input type="hidden" name="origDay" value="${dVal}">
    <div class="field"><label>Gün *</label><select name="day">${[1,2,3,4,5,6,7].map(i => `<option value="${i}" ${dVal === i ? "selected" : ""}>${TR_DAYS[i % 7]}</option>`).join("")}</select></div>
    <div class="field"><label>Tür</label><select name="type">${Object.entries(EX_TYPES).map(([k2, o]) => `<option value="${k2}" ${tp === k2 ? "selected" : ""}>${exType(k2).e} ${o.t}</option>`).join("")}</select></div>
    <div class="field full"><label>Egzersiz adı *</label><input name="name" list="exPlanNames" required maxlength="80" value="${esc(item.name || "")}" placeholder="örn. Pilates & alt beden"><datalist id="exPlanNames">${EX_NAME_SUGGESTIONS.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist></div>
    <div class="field"><label>Hedef süre (dakika) *</label><input type="number" name="min" min="1" max="600" required value="${esc(item.min ?? 25)}"></div>
    <div class="field"><label>Set / tekrar</label><input name="sets" maxlength="40" value="${esc(item.sets || "")}" placeholder="örn. 3x12"></div>

function openReadModal(id) {
  const r = READINGS.find(x => x.id === id) || readingFor(today(), UI.readOff);
  openModal(`${esc(r.title)}`, `<div class="reading"><div class="row between mb"><span class="tag lav">${esc(r.cat)}</span>
      <button class="btn icon sm soft" data-act="fav" data-id="${r.id}" title="Favori">${S.favorites.includes(r.id) ? "💗" : "🤍"}</button></div>
    ${r.p.map(p => `<p>${esc(p)}</p>`).join("")}
    <div class="msg mt">${esc(r.msg)}</div></div>
    <div class="modal-foot"><button class="btn soft" data-act="readMoreModal">Bir tane daha oku</button><button class="btn" data-act="closeModal">Kapat 🌷</button></div>`, {wide: true});

<script>
"use strict";
const PAGES = {home: pageHome, routines: pageRoutines, water: pageWater, nutrition: pageNutrition, school: pageSchool, garden: pageGarden, progress: pageProgress, journal: pageJournal, skincare: pageSkincare, exercise: pageExercise, settings: pageSettings};

/* ---------------- AÇILIŞ EKRANI ---------------- */
function shouldShowWelcome(k = today()) {
  const d = dayR(k);
  return !d.welcomeSeen && !d.mood;
}
function showWelcome() {
  const ex = $("#welcomeScreen"); if (ex) ex.remove();
  const k = today(), w = document.createElement("div");
  w.className = "welcome"; w.id = "welcomeScreen";
  w.innerHTML = `<div class="welcome-card">
    <span class="wfloat" style="top:16px;left:22px">🌸</span>
    <span class="wfloat" style="top:24px;right:24px;animation-delay:-2s">🦋</span>
    <span class="wfloat" style="bottom:20px;left:28px;animation-delay:-4s">🌿</span>
    <span class="wfloat" style="bottom:24px;right:26px;animation-delay:-1s">✨</span>
    <div class="small muted" style="font-weight:700">${fmtLong(k)}</div>
    <h1>Hoş geldin Tuğba 🌷</h1>
    <p class="lead">Bugün kendin için küçük bir şey yapmaya ne dersin?</p>
    <p class="wtext">Burası kendin için kurduğun küçük dünya.<br>Burada mükemmel olmak zorunda değilsin.<br>Burada sadece büyümek, öğrenmek, iyileşmek ve kendine yeniden dönmek var.<br>Haydi, bugün birlikte küçük bir şey yapalım. 🌱</p>
    <p class="en">“Perfect days are not required. Small steps are enough.”</p>
    <div class="wquote">✨ ${esc(motivation(k))}</div>
    <div class="lbl" style="margin:14px 0 8px">Bugün ruh hâlin nasıl?</div>
    <div style="display:flex;justify-content:center">${moodPicker(k, "welcomeMood")}</div>
    <div class="mt" style="margin-top:20px"><button class="btn big" data-act="startDay">Bugüne Başla 🌷</button></div>
  </div>`;
  document.body.appendChild(w);
}

/* ---------------- İŞLEV YARDIMCILARI ---------------- */
function addWater(ml, srcEl = null) {
  ml = Math.round(+ml || 0); if (ml <= 0) return;
  const k = today(), d = day(k);
  d.water.push({ml, t: nowTime()});
  S.garden.bank += ml;
  addGrowth(2, k);
  if (d.water.length <= 5) award("water_sip_" + d.water.length, 2, "Su 💧", 0, k, centerOf(srcEl));
  let msg = `+${ml} ml su eklendi · +2 bahçe puanı 💧🌱`;
  if (waterTotal(k) >= S.settings.waterGoal && award("water", 15, "Su hedefi 💧", 8, k, centerOf(srcEl))) {
    msg = "Günlük su hedefine ulaştın! +15 XP 💧🌷";
    confettiBurst(window.innerWidth / 2, window.innerHeight / 3, 24);
  }
  save(); render(); checkWeekBonus();
  const g = $("#glassBig") || $("#glassSm");
  if (g) { const drop = document.createElement("span"); drop.className = "drop-fx"; drop.textContent = "💧"; g.appendChild(drop); setTimeout(() => drop.remove(), 950); }
  toast(msg);
  setTimeout(checkMilestones, 900);
}
function checkRoutineDone(k, pos) {
  const st = dayStats(k);
  if (st.m.length && st.mDone === st.m.length && award("morning", 20, "Sabah rutini ☀️", 10, k, pos)) {
    confettiBurst(pos ? pos.x : window.innerWidth / 2, pos ? pos.y : 200, 22);
    toast("Sabah rutinin tamam! +20 XP ☀️");
  }
  if (st.e.length && st.eDone === st.e.length && award("evening", 20, "Akşam rutini 🌙", 10, k, pos)) {
    confettiBurst(pos ? pos.x : window.innerWidth / 2, pos ? pos.y : 200, 22);
    toast("Akşam rutinin tamam! +20 XP 🌙");
  }
  checkWeekBonus();
}
function updateTimer() {
  if (!UI.timer) return;
  const sec = Math.max(0, Math.floor((Date.now() - UI.timer.start) / 1000));
  const txt = `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
  const el = $("#timerTxt"); if (el) el.textContent = txt;
  const tb = $("#topTimerBtn"); if (tb) { tb.textContent = `⏱ ${txt}`; tb.classList.remove("hidden"); }
  const sb = $("#sideTimerBtn"); if (sb) sb.textContent = `⏱ Odak sayacı: ${txt}`;
}
function persistTimer() {
  try {
    if (UI.timer) localStorage.setItem(TIMER_KEY, JSON.stringify({ start: UI.timer.start, courseId: UI.timer.courseId || "" }));
    else localStorage.removeItem(TIMER_KEY);
  } catch (e) {}
}
function restoreTimer() {
  if (UI.timer) return;
  try {
    const raw = localStorage.getItem(TIMER_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && +parsed.start > 0 && (Date.now() - (+parsed.start)) < 43200000) {
      UI.timer = { start: +parsed.start, courseId: parsed.courseId || "", iv: setInterval(updateTimer, 1000) };
    } else {
      localStorage.removeItem(TIMER_KEY);
    }
  } catch (e) {}
}
function syncRoutineToSkincare(taskId, done, k = today(), pos = null) {
  const d = day(k);
  const allMorning = [...(S.routines.school || []), ...(S.routines.off || [])];
  const mTask = allMorning.find(t => t.id === taskId && /cilt bakım/i.test(t.text || ""));
  const eTask = (S.routines.evening || []).find(t => t.id === taskId && /cilt bakım/i.test(t.text || ""));
  const tab = eTask ? "evening" : mTask ? "morning" : null;
  if (!tab) return;
  const list = S.skincare[tab] || [];
  list.forEach(it => {
    d.skinChecks[it.id] = done;
    if (done) award("skin_" + it.id, 2, "Cilt bakımı adımı 🧴", 1, k, pos);
  });
  if (done && list.length && award("skin_done_" + tab, 10, tab === "morning" ? "Sabah cilt bakımı ☀️" : "Akşam cilt bakımı 🌙", 4, k, pos)) {
    checkWeekBonus();
  }
}
function syncSkincareToRoutine(tab, allDone, k = today(), pos = null) {
  const d = day(k);
  const pools = tab === "evening" ? [S.routines.evening || []] : [S.routines.school || [], S.routines.off || []];
  let matched = false;
  pools.forEach(rList => {
    rList.filter(t => /cilt bakım/i.test(t.text || "")).forEach(t => {
      d.checks[t.id] = allDone;
      matched = true;
      if (allDone) award("task_" + t.id, 2, "Rutin adımı", 2, k, pos);
    });
  });
  if (allDone && matched) checkRoutineDone(k, pos);
}
let lastRemind = 0;
function checkReminder() {
  if (!S.settings.notify) return;
  const now = Date.now(), gap = (S.settings.notifyEvery || 2) * 3600000;
  if (now - lastRemind < gap) return;
  lastRemind = now;
  const msg = waterTotal(today()) < S.settings.waterGoal ? "Tuğba, bir yudum su içmeye ne dersin? 💧" : "Küçük bir esneme ve nefes molası zamanı 🌸";
  toast(msg, 4000);
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification("Bloom 🌷", {body: msg}); } catch (e) {}
  }
}

/* ---------------- TIKLAMA OLAYLARI ---------------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, ds = el.dataset, pos = centerOf(el);
  if (el.closest(".garden-mini") && (act === "treeTap" || act === "butterfly")) { go("garden"); return; }

  switch (act) {
    case "go": ev.stopPropagation(); go(ds.page); break;
    case "goStudyTimer": UI.page = "school"; UI.course = null; UI.schoolTab = "study"; closeModal(); render(); break;
    case "closeModal": closeModal(); break;
    case "confirmYes": { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); break; }
    case "startDay": {
      day(today()).welcomeSeen = true; save();
      const w = $("#welcomeScreen");
      if (w) { w.classList.add("out"); setTimeout(() => w.remove(), 550); }
      render();
      break;
    }
    case "showWelcome": showWelcome(); break;
    case "welcomeMood":
    case "setMood": {
      const k = ds.k || today(), d = day(k);
      d.mood = ds.m; d.welcomeSeen = true; save();
      if (act === "welcomeMood") {
        const host = el.closest(".mood-row");
        if (host) host.outerHTML = moodPicker(k, "welcomeMood");
        render();
        toast(MOOD_MSG[ds.m] || "Kaydedildi 🌷");
      } else { render(); }
      break;
    }
    case "setMode": { const k = ds.k || today(); day(k).mode = ds.m; save(); render(); break; }
    case "toggleSchool": { const k = ds.k || today(); day(k).school = !isSchool(k); save(); render(); break; }
    case "setSchool": { const k = ds.k || today(); day(k).school = ds.v === "1"; save(); render(); break; }
    case "weekReport": openWeekReport(ds.ws || weekStart(today())); break;
    case "homeTab": UI.homeTab = ds.t; render(); break;

    case "toggleTask": {
      const k = today(), d = day(k), id = ds.id;
      const done = !d.checks[id]; d.checks[id] = done;
      syncRoutineToSkincare(id, done, k, pos);
      if (done) {
        award("task_" + id, 2, "Rutin adımı", 2, k, pos);

          if (bd) { bd.innerHTML = calBreakdownHTML(est); bd.classList.toggle("hidden", !est.fromIngredients); }
          if (calIn && calIn.dataset.manual !== "1") calIn.value = est.kcal || "";
          if (hint && (!calIn || calIn.dataset.manual !== "1")) hint.textContent = calHintText(est);
        }
        toast(`İnternetten bulundu: ${best.name} (${best.kcal100} kcal/100g) 🌐`);

    case "aiCalcMeal": {
