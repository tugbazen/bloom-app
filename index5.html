      break;
    }
    case "toggleAiKeyVis": {
      const inp = $("#aiKeySettingsInput");
      if (inp) inp.type = inp.type === "password" ? "text" : "password";
      break;
    }
    case "testAiKey": {

      const key = (inp ? inp.value : (S.settings.aiKey || "")).trim();

      if (sel) S.settings.aiModel = sel.value || "gemini-2.5-flash";
      save();
      toast("Yapay zeka bağlantısı test ediliyor… 🤖");
      analyzeMealWithAI({cat: "ara", name: "1 orta elma", ingredients: "1 orta elma"}, "").then(r => {
        if (r.ok) toast(`Bağlantı başarılı (${r.model}) ✓ 🤖`);
        else toast(`Test başarısız: ${r.error}`);

      break;

    case "clearAiKey": {
      S.settings.aiKey = ""; save(); render(); toast("Gemini API anahtarı silindi");
      break;

    case "resetAll": confirmBox("Tüm rutinlerin, su, yemek, ders, bahçe ve günlük verilerin kalıcı olarak silinecek. Öncesinde yedek almanı öneririm. Devam edilsin mi?", () => {

      } catch (e) {}
      S = defaults(); save(); render(); toast("Tüm veriler sıfırlandı 🌱");
      if (typeof window.__bloomOpenOnboarding === "function") window.__bloomOpenOnboarding(false);

});

/* ---------------- FORM GÖNDERİMLERİ ---------------- */
document.addEventListener("submit", ev => {
  const form = ev.target.closest("form[data-form]"); if (!form) return;
  ev.preventDefault();
  const fd = new FormData(form), type = form.dataset.form, k = fd.get("k") || today();

  switch (type) {
    case "addGoal": {
      const text = (fd.get("text") || "").trim(); if (!text) return;
      day(k).goals.push({id: uid(), text, done: false}); save(); render(); toast("Hedef eklendi 🎯"); break;
    }
    case "move": {
      const d = day(k); d.move = {min: +fd.get("min") || 0, steps: +fd.get("steps") || 0};
      if ((d.move.min > 0 || d.move.steps > 0) && award("move_any", 5, "Hareket başlangıcı 🌿", 3, k)) S.garden.leaves = (S.garden.leaves || 0) + 1;
      if ((d.move.min >= 20 || d.move.steps >= 5000) && award("move", 20, "Hareket 👟", 6, k)) {
        S.garden.leaves = (S.garden.leaves || 0) + 2; toast("Hareket kaydedildi! +20 XP ve bahçene yeni yapraklar 🍃");
      } else toast("Hareket kaydedildi 👟");
      save(); render(); break;
    }
    case "rAdd": {
      const text = (fd.get("text") || "").trim(), list = fd.get("list"); if (!text || !S.routines[list]) return;
      S.routines[list].push(r(text, 3, fd.get("time") || "")); save(); render(); toast("Görev eklendi 🌷"); break;
    }
    case "medAdd": {
      const name = (fd.get("name") || "").trim(); if (!name) return;
      S.settings.meds.push({id: uid(), name, time: fd.get("time") || ""}); save(); render(); toast("Eklendi 💊"); break;
    }
    case "customWater": { const ml = +fd.get("ml"); if (ml > 0) addWater(ml, form); break; }
    case "waterGoal": {
      const g = Math.max(500, Math.min(6000, +fd.get("goal") || 2000));
      S.settings.waterGoal = g; save(); render(); toast(`Su hedefi ${fmtMl(g)} olarak güncellendi 💧`); break;
    }
    case "meal": {
      const id = fd.get("id"), existing = id ? S.meals.find(m => m.id === id) : null;
      const photo = UI.photo || (fd.get("rmPhoto") ? null : (existing ? existing.photo : null));
      const calIn = $("#mealCalInput");
      const ingredients = (fd.get("ingredients") || "").trim();
      const calManual = !!(calIn && calIn.dataset.manual === "1" && fd.get("cal"));
      let calVal = fd.get("cal") ? +fd.get("cal") : "";
      if (calVal === "" && !calManual && ((fd.get("name") || "").trim() || ingredients)) {
        const est = estimateCalories(fd.get("name"), fd.get("desc"), fd.get("portion"), fd.get("cat"), ingredients);
        if (est.kcal) calVal = est.kcal;
      }
      let macros = null;
      const rawMac = (fd.get("macrosJson") || "").trim();
      if (rawMac) { try { macros = JSON.parse(rawMac); } catch (e) {} }
      else if (existing && existing.macros && !calManual && String(calVal) === String(existing.cal || "")) macros = existing.macros;
      const calSource = (fd.get("calSource") || "").trim() || (calManual ? "manual" : (ingredients ? "ingredients" : "local"));
      const item = {id: id || uid(), cat: fd.get("cat"), name: (fd.get("name") || "").trim(), ingredients, desc: (fd.get("desc") || "").trim(),
        date: fd.get("date"), time: fd.get("time"), portion: (fd.get("portion") || "").trim(), cal: calVal, calManual, macros, calSource,
        protein: (fd.get("protein") || "").trim(), veg: !!fd.get("veg"), note: (fd.get("note") || "").trim(), photo};
      if (existing) Object.assign(existing, item); else { S.meals.push(item); award("meal_" + item.id, 5, "Öğün kaydı 🥗", 2, item.date); }
      save(); closeModal(); render(); toast("Öğün kaydedildi 🥗"); break;
    }
    case "aiSettings": {
      S.settings.aiKey = (fd.get("aiKey") || "").trim();
      S.settings.aiModel = (fd.get("aiModel") || "gemini-2.5-flash").trim();
      save(); render(); toast(S.settings.aiKey ? "Yapay zeka ayarları kaydedildi 🤖" : "AI anahtarı temizlendi");
      break;
    }
    case "suggestPlan": {
      const d = fd.get("day"), slot = fd.get("slot");
      if (!S.mealPlan[d]) S.mealPlan[d] = {};
      S.mealPlan[d][slot] = fd.get("name");
      save(); closeModal(); toast("Haftalık yemek planına eklendi 🗓️"); break;
    }
    case "course": {
      const id = fd.get("id"), data = {name: fd.get("name").trim(), ects: Math.max(0.5, Math.min(30, +fd.get("ects") || 3)), instructor: fd.get("instructor").trim(), examDate: fd.get("examDate"), desc: fd.get("desc").trim()};
      if (id) { const c = S.courses.find(x => x.id === id); if (c) Object.assign(c, data); }
      else S.courses.push(Object.assign(newCourse(data.name, data.ects), data));
      save(); closeModal(); render(); toast("Ders kaydedildi 📚"); break;
    }
    case "quickCourse": {
      const n = (fd.get("name") || "").trim(); if (!n) return;
      const ects = Math.max(0.5, Math.min(30, +fd.get("ects") || 3));
      S.courses.push(newCourse(n, ects)); save(); render(); toast("Ders eklendi 📚"); break;
    }
    case "exam": {
      const cid = resolveFormCourseId(fd);
      const id = fd.get("id"), data = {courseId: cid, name: fd.get("name").trim(), date: fd.get("date"), priority: fd.get("priority"), topics: fd.get("topics").trim(), plan: fd.get("plan").trim()};
      if (id) { const e = S.exams.find(x => x.id === id); if (e) Object.assign(e, data); }
      else S.exams.push({id: uid(), done: false, ...data});
      save(); closeModal(); render(); toast("Sınav kaydedildi 📅"); break;
    }
    case "grade": {
      const id = fd.get("id");
      const cid = resolveFormCourseId(fd);
      const item = {id: id || uid(), courseId: cid, type: fd.get("type") || "Vize",
        score: Math.max(0, Math.min(100, +fd.get("score") || 0)),
        weight: Math.max(0, Math.min(100, +fd.get("weight") || 0)),
        date: fd.get("date") || today(), note: (fd.get("note") || "").trim()};
      if (id) { const g = S.grades.find(x => x.id === id); if (g) Object.assign(g, item); }
      else { S.grades.push(item); award("grade_" + item.id, 5, "Sınav notu kaydı 🎓", 2, item.date); }
      save(); closeModal(); render(); toast("Sınav notu kaydedildi 🎓"); break;
    }
    case "study": {

      const cid = resolveFormCourseId(fd);
      const stEntry = {id: uid(), courseId: cid, date: dt, minutes: Math.max(1, +fd.get("minutes") || 25), topic: fd.get("topic").trim()};
      S.study.push(stEntry);
      if (!award("study", 25, "Ders çalışmak 📚", 8, dt)) award("study_" + stEntry.id, 10, "Ek çalışma 📚", 4, dt);
      save(); closeModal(); render(); toast("Çalışma kaydedildi! 📚"); break;

    case "topicAdd": {
      const c = S.courses.find(x => x.id === UI.course), t = fd.get("type"), text = (fd.get("text") || "").trim();
      if (!c || !text || !Array.isArray(c[t])) break;

      const hasIn = arr => (arr || []).some(x => normTopic(x.text) === key);
      if (!hasIn(c[t])) c[t].push({id: uid(), text, date: today(), done: false});
      if (t === "covered" && !hasIn(c.todo)) {
        c.todo.push({id: uid(), text, date: today(), done: false});
        save(); render(); toast("İşlenen ve çalışılacak konulara eklendi ✓"); break;
      }
      save(); render(); toast("Konu eklendi ✓"); break;
    }
    case "week": {
      const c = S.courses.find(x => x.id === UI.course); if (!c) break;
      const id = fd.get("id"), data = {num: +fd.get("num") || 1, date: fd.get("date"), title: fd.get("title").trim()};
      if (id) { const w = c.weeks.find(x => x.id === id); if (w) Object.assign(w, data); }
      else c.weeks.push({id: uid(), slides: [], solved: 0, wrong: 0, covered: "", todo: "", done: "", missing: "", review: "", ...data});
      save(); closeModal(); render(); toast("Hafta kaydedildi 🗂️"); break;
    }
    case "slide": {
      const c = S.courses.find(x => x.id === UI.course), w = c && c.weeks.find(x => x.id === fd.get("weekId")); if (!w) break;
      w.slides = w.slides || [];
      const id = fd.get("id"), st = +fd.get("status") || 0, existing = id ? w.slides.find(x => x.id === id) : null;
      const data = {no: fd.get("no").trim(), name: fd.get("name").trim(), date: fd.get("date"), status: st, notes: fd.get("notes").trim()};
      if (st === 2 && (!existing || existing.status !== 2)) { data.doneDate = today(); award("slide_" + (id || data.name), 10, "Slayt tamamlandı 🗂️", 4); }
      if (existing) Object.assign(existing, data); else w.slides.push({id: uid(), ...data});
      save(); closeModal(); render(); toast("Slayt kaydedildi ✓"); break;
    }
    case "track": {
      const c = S.courses.find(x => x.id === UI.course), w = c && c.weeks.find(x => x.id === fd.get("weekId")); if (!w) break;
      const oldS = +w.solved || 0, newS = Math.max(0, +fd.get("solved") || 0);

      Object.assign(w, {solved: newS, wrong: Math.max(0, +fd.get("wrong") || 0), covered: fd.get("covered"), todo: fd.get("todo"), done: fd.get("done"), missing: fd.get("missing"), review: fd.get("review")});

    case "reviewAdd": {
      const c = S.courses.find(x => x.id === UI.course), text = (fd.get("text") || "").trim(), dt = fd.get("date") || addDays(today(), 1);
      if (!c || !text) break;
      if ($("#spacedChk")?.checked) [0, 2, 6, 13].forEach(off => c.review.push({id: uid(), text: `${text} (tekrar)`, date: addDays(dt, off), done: false}));
      else c.review.push({id: uid(), text, date: dt, done: false});
      save(); render(); toast("Tekrar planına eklendi 🔁"); break;
    }
    case "progress": {
      const id = fd.get("id");
      const item = {id: id || uid(), date: fd.get("date") || today(), weight: fd.get("weight"), waist: fd.get("waist"), hip: fd.get("hip"),

  } else if (chg === "gradeType") {

    });

    S.study.forEach(s => {

        if (award("move_any", 5, "Hareket başlangıcı 🌿", 3, dk)) S.garden.leaves = (S.garden.leaves || 0) + 1;

  if (skRec && skRec.skinLabel) profile.skinLabel = skRec.skinLabel;
  if (exRec && exRec.exLabel) profile.exLabel = exRec.exLabel;
  if (exRec && exRec.weeklyGoalMin) profile.weeklyGoalMin = exRec.weeklyGoalMin;
  profile.skinApplied = true;
  profile.exerciseApplied = true;
  profile.distinctDayRoutinesV1 = true;
  S.profile = profile;
  const mapItems = (items, prevList) => {
    const prev = Array.isArray(prevList) ? prevList : [];
    return (items || []).map(it => {
      const existing = prev.find(p => trNorm(p.text) === trNorm(it.text));
      return {
        id: existing ? existing.id : uid(),
        text: it.text,
        lvl: it.lvl || 2,
        time: it.time !== undefined ? it.time : (existing ? existing.time : "")
      };
    });
  };
  if (Array.isArray(schoolItems) && schoolItems.length) {
    S.routines.school = mapItems(schoolItems, S.routines.school);
  }
  if (Array.isArray(offItems) && offItems.length) {
    S.routines.off = mapItems(offItems, S.routines.off);
  }
  if (Array.isArray(eveningItems) && eveningItems.length) {
    S.routines.evening = mapItems(eveningItems, S.routines.evening);
  }
  if (skRec && Array.isArray(skRec.morning) && skRec.morning.length) {
    S.skincare.morning = skRec.morning.map(x => Object.assign({}, x));
  }
  if (skRec && Array.isArray(skRec.evening) && skRec.evening.length) {
    S.skincare.evening = skRec.evening.map(x => Object.assign({}, x));
  }
  if (exRec && exRec.plan && typeof exRec.plan === "object") {
    [1,2,3,4,5,6,7].forEach(d1 => {
      if (Array.isArray(exRec.plan[d1])) {
        S.exercise.plan[d1] = exRec.plan[d1].map(x => Object.assign({}, x));
      }
    });
    S.exercise.presetAge = Number(profile.age) || null;
    S.exercise.presetLabel = exRec.exLabel || "";
    S.exercise.presetGoalMin = +exRec.weeklyGoalMin || null;
  }
  save();
  render();
  if (!silent) {
    toast(`${profile.age} yaş (${profile.gender === "male" ? "Erkek" : profile.gender === "other" ? "Kişisel" : "Kadın"}) rutinleri, cilt bakımı ve egzersiz programı yüklendi! 🌷`);
  }
};
window.__bloomBack = function() {
  if ($("#modal")) { closeModal(); return "handled"; }
  if ($("#welcomeScreen")) { day(today()).welcomeSeen = true; save(); $("#welcomeScreen").remove(); return "handled"; }
  if (UI.course) { UI.course = null; render(); return "handled"; }
  if (UI.page !== "home") { go("home"); return "handled"; }
  return "exit";
};
init();
</script>
